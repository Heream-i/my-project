<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Validated GitHub Contact Form</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 20px auto; padding: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background: #2ea44f; color: white; border: none; cursor: pointer; border-radius: 6px; }
        .hidden-field { display: none !important; }
        .error-border { border: 1px solid red !important; }
    </style>
</head>
<body>

    <h2>Contact Form</h2>
    
		<form id="contactForm" action="https://api.web3forms.com/submit" method="POST">
        <!-- Paste your Web3Forms Access Key here -->
        <input type="hidden" name="access_key" value="90788836-3480-4860-9b85-4d23cb77fb4a">

        <!-- Honeypot field for bot protection -->
        <div class="form-group hidden-field">
            <label for="honeypot">Do not fill this out:</label>
            <input type="text" id="honeypot" name="honeypot" tabindex="-1" autocomplete="off">
        </div>

        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required >
        </div>
        
        <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="text" id="email" name="email" required>
        </div>
        
        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" required></textarea>
        </div>   
        <button type="submit">Submit Form</button>
    </form>

    <div id="responseMessage" style="margin-top:15px; font-weight:bold;"></div>

    <script>
        const form = document.getElementById('contactForm');
        const emailInput = document.getElementById('email');
        const messageInput = document.getElementById('message');
        const nameInput = document.getElementById('name');
        const responseMessage = document.getElementById('responseMessage');

        // Helper function to read the external badwords.txt file
        async function fetchBadWords() {
            try {
                const response = await fetch('./badwords.txt');
                if (!response.ok) return []; // Fallback if file doesn't exist
                const text = await response.text();
                // Split by line breaks, trim whitespaces, remove empty lines
                return text.split(/\r?\n/).map(word => word.trim().toLowerCase()).filter(word => word.length > 0);
            } catch (e) {
                console.error("Could not load badwords.txt", e);
                return [];
            }
        }

        // Helper function to test regex-based email validity
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email.trim());
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            // Reset UI states
            responseMessage.textContent = "";
            emailInput.classList.remove('error-border');
            messageInput.classList.remove('error-border');

            // 1. Honeypot check (Bot Filter)
            const honeypot = document.getElementById('honeypot').value;
            if (honeypot !== "") {
                responseMessage.style.color = 'green';
                responseMessage.textContent = 'Message sent successfully!';
                form.reset();
                return; 
            }

            // 2. Email validation check
            if (!isValidEmail(emailInput.value)) {
                emailInput.classList.add('error-border');
                responseMessage.style.color = 'red';
                responseMessage.textContent = 'Please enter a valid email address structure (e.g., user@example.com).';
                return;
            }

            // 3. Profanity filtering check
            const badWordsList = await fetchBadWords();
            const combinedInputText = `${nameInput.value} ${emailInput.value} ${messageInput.value}`.toLowerCase();
            
            const containsProfanity = badWordsList.some(badWord => {
                // Uses word boundaries so it checks for exact words, not inside innocent ones (like "assume")
                const regex = new RegExp(`\\b${badWord}\\b`, 'i');
                return regex.test(combinedInputText);
            });

            if (containsProfanity) {
                messageInput.classList.add('error-border');
                responseMessage.style.color = 'red';
                responseMessage.textContent = 'Your message contains language that is not permitted.';
                return;
            }

            // 4. Send clean, validated data to Web3Forms API
            const formData = new FormData(form);
            formData.delete('honeypot'); // Clean up payload

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    responseMessage.style.color = 'green';
                    responseMessage.textContent = 'Message sent successfully!';
                    form.reset();
                } else {
                    responseMessage.style.color = 'red';
                    responseMessage.textContent = result.message || 'Submission failed.';
                }
            } catch (error) {
                responseMessage.style.color = 'red';
                responseMessage.textContent = 'Error connecting to the mail server.';
            }
        });
    </script>
</body>
</html>
